services:
  db:
    image: postgres:16-alpine
    container_name: assetto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: assetto
      POSTGRES_PASSWORD: assetto
      POSTGRES_DB: assetto
    ports:
      - "5432:5432"
    volumes:
      - assetto-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetto -d assetto"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  assetto-db-data:
